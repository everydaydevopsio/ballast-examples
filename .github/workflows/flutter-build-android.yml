name: Build Android

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*.*.*'

defaults:
  run:
    working-directory: ballast_flutter_example

jobs:
  build-android:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: ${{ secrets.FLUTTER_CHANNEL || 'stable' }}
          version: ${{ secrets.FLUTTER_VERSION || '3.44.8' }}

      - name: Cache pub
        uses: actions/cache@v4
        with:
          path: ~/.pub-cache
          key: pub-${{ runner.os }}-${{ hashFiles('**/pubspec.yaml', '**/pubspec.lock') }}

      - name: Install dependencies
        run: flutter pub get

      - name: Build APK
        run: flutter build apk --release

      - name: Build AAB
        run: flutter build appbundle --release

      - name: Upload APK
        uses: actions/upload-artifact@v7
        with:
          name: android-apk
          path: ballast_flutter_example/build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error

      - name: Upload AAB
        uses: actions/upload-artifact@v7
        with:
          name: android-aab
          path: ballast_flutter_example/build/app/outputs/bundle/release/app-release.aab
          if-no-files-found: error
