version: 2
updates:
  - package-ecosystem: "gomod"
    directory: "/go-sample"
    schedule:
      interval: "weekly"

  - package-ecosystem: "pip"
    directory: "/python-sample"
    schedule:
      interval: "weekly"

  - package-ecosystem: "npm"
    directory: "/typescript-sample"
    schedule:
      interval: "weekly"
    ignore:
      - dependency-name: "typescript"
        update-types:
          - "version-update:semver-major"

  - package-ecosystem: "pub"
    directory: "/ballast_flutter_example"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 10
    groups:
      flutter-dependencies:
        patterns:
          - "flutter*"
          - "dart*"
      dev-dependencies:
        patterns:
          - "*_test"
          - "*test*"
          - "mockito"
          - "build_runner"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
