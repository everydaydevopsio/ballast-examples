name: Build iOS

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*.*.*'

defaults:
  run:
    working-directory: ballast_flutter_example

jobs:
  build-ios:
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: ${{ secrets.FLUTTER_CHANNEL || 'stable' }}
          version: ${{ secrets.FLUTTER_VERSION || '3.44.8' }}

      - name: Cache pub
        uses: actions/cache@v6
        with:
          path: ~/.pub-cache
          key: pub-${{ runner.os }}-${{ hashFiles('**/pubspec.yaml', '**/pubspec.lock') }}

      - name: Install dependencies
        run: flutter pub get

      - name: Build iOS
        run: flutter build ios --release --no-codesign

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ios-build
          path: ballast_flutter_example/build/ios/iphoneos/Runner.app
          if-no-files-found: error
